<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WBG NIMS Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
      body { 
        font-family: 'Roboto', sans-serif; 
        background-color: #f5f5f6; 
        display: flex; 
        justify-content: center; 
        margin: 40px 10px; 
      }
      .container { 
        background: #ffffff; 
        padding: 32px; 
        border-radius: 8px; 
        box-shadow: 0px 3px 1px -2px rgba(0,0,0,0.2), 0px 2px 2px 0px rgba(0,0,0,0.14), 0px 1px 5px 0px rgba(0,0,0,0.12); 
        width: 100%; 
        max-width: 650px; 
      }
      .hidden { display: none !important; }
      
      h2 { color: #202124; font-weight: 500; font-size: 24px; margin-top: 0; margin-bottom: 24px; letter-spacing: 0.2px;}
      .input-label { font-size: 14px; color: #5f6368; font-weight: 500; margin-bottom: 8px; display: block; }
      
      .md-input, .md-select { 
        width: 100%; padding: 14px 16px; margin-bottom: 24px; 
        border: 1px solid #c4c4c4; border-radius: 4px; 
        font-size: 16px; font-family: 'Roboto', sans-serif; 
        transition: border-color 0.2s; box-sizing: border-box; background: white;
      }
      .md-input:focus, .md-select:focus { border-color: #1a73e8; outline: none; box-shadow: inset 0 0 0 1px #1a73e8; }
      
      .md-button { 
        background-color: #1a73e8; color: #ffffff; border: none; border-radius: 4px; 
        padding: 12px 24px; font-size: 14px; font-weight: 500; text-transform: uppercase; 
        cursor: pointer; letter-spacing: 0.5px; 
        box-shadow: 0px 3px 1px -2px rgba(0,0,0,0.2), 0px 2px 2px 0px rgba(0,0,0,0.14), 0px 1px 5px 0px rgba(0,0,0,0.12); 
        transition: background-color 0.2s, box-shadow 0.2s; 
        width: 100%; box-sizing: border-box; 
      }
      .md-button:hover { 
        background-color: #1557b0; 
        box-shadow: 0px 2px 4px -1px rgba(0,0,0,0.2), 0px 4px 5px 0px rgba(0,0,0,0.14), 0px 1px 10px 0px rgba(0,0,0,0.12); 
      }
      
      .update-banner {
        background-color: #e8f0fe; color: #1a73e8; padding: 12px 16px; border-radius: 8px;
        font-size: 14px; font-weight: 500; margin-bottom: 24px; display: flex;
        align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
      }
      .banner-text { display: flex; align-items: center; }
      .banner-text span { margin-right: 8px; font-size: 18px; }
      .banner-actions { display: flex; gap: 8px; }
      .icon-btn {
        background: #ffffff; color: #1a73e8; border: 1px solid #1a73e8;
        border-radius: 4px; padding: 6px 12px; font-size: 12px; font-weight: 500;
        cursor: pointer; transition: background 0.2s; white-space: nowrap;
      }
      .icon-btn:hover { background: #d2e3fc; }
      .logout-btn { color: #d93025; border-color: #d93025; }
      .logout-btn:hover { background: #fce8e6; }

      .summary-box { 
        display: flex; justify-content: space-around; 
        background: #ffffff; padding: 16px; border-radius: 8px; margin-bottom: 24px; 
        border: 1px solid #e0e0e0; box-shadow: 0px 2px 1px -1px rgba(0,0,0,0.05); 
      }
      .sum-item { text-align: center; }
      .sum-item strong { font-size: 12px; color: #5f6368; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500;}
      .sum-item span { display: block; font-size: 24px; font-weight: 400; margin-top: 8px; color: #202124; }
      
      /* NEW TABLE WRAPPER FOR SCROLLING */
      .table-wrapper {
        width: 100%;
        overflow-x: auto; /* Enables horizontal scroll */
        -webkit-overflow-scrolling: touch; /* Smooth scroll on iOS */
        margin-bottom: 32px;
      }

      .dash-table { 
        width: 100%; 
        border-collapse: collapse; 
        font-size: 14px; 
        min-width: 600px; /* Forces table to stay wide enough */
        white-space: nowrap; /* PREVENTS TEXT FROM WRAPPING OR SQUISHING */
      }
      .dash-table th, .dash-table td { padding: 16px 10px; border-bottom: 1px solid #e0e0e0; }
      .dash-table th { color: #5f6368; font-weight: 500; background-color: #f8f9fa;}
      .dash-table tr:hover { background-color: #f5f5f5; }
      
      .col-team { text-align: left; padding-left: 16px !important; }
      .col-total { text-align: center; }
      .col-done { text-align: center; }
      .col-submit { text-align: center; }
      .col-percent { text-align: center; padding-right: 16px !important; }
      
      .progress-container { width: 100%; min-width: 60px; margin: 0 auto; text-align: center; }
      .progress-text { font-size: 14px; margin-bottom: 4px; }
      .progress-bar-bg { background-color: #e0e0e0; height: 3px; border-radius: 2px; width: 100%; overflow: hidden; }
      .progress-bar-fill { background-color: #1a73e8; height: 100%; border-radius: 2px; transition: width 0.5s ease-in-out; }

      .text-done { color: #1e8e3e; }
      .text-survey { color: #d93025; }
      .text-blue { color: #1a73e8; }
      
      .result-container { margin-top: 24px; }
      .match-card { background: #ffffff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px; margin-bottom: 12px; box-shadow: 0px 1px 2px 0px rgba(0,0,0,0.05); }
      .route-title { font-size: 16px; font-weight: 500; color: #202124; margin-bottom: 8px; }
      .team-text { color: #5f6368; font-size: 14px; margin-bottom: 6px; }
      .status-done { color: #1e8e3e; font-size: 14px; font-weight: 500; margin-top: 8px;}
      .status-survey { color: #d93025; font-size: 14px; font-weight: 500; margin-top: 8px;}
      
      .alert-text { background: #fce8e6; color: #d93025; padding: 16px; border-radius: 8px; font-weight: 500; }
      .success-notice { background: #e6f4ea; color: #1e8e3e; padding: 16px; border-radius: 8px; font-weight: 500; }
      .loading { color: #5f6368; font-style: italic; margin-top: 16px; font-size: 14px; }
      .section-divider { border-bottom: 1px solid #e0e0e0; margin: 32px 0; }
      
      .route-list { padding-left: 20px; color: #5f6368; margin-bottom: 0; }
      .route-list li { margin-bottom: 8px; line-height: 1.5; }
      .circle-tick { display: inline-block; background-color: #1e8e3e; color: #ffffff; width: 16px; height: 16px; line-height: 16px; text-align: center; border-radius: 50%; font-size: 10px; margin-left: 8px; vertical-align: middle; }
      .pill-kmz { display: inline-block; background-color: #e6f4ea; color: #1e8e3e; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; margin-left: 8px; border: 1px solid #cce8d6; vertical-align: middle; }
      
      .app-footer { text-align: center; margin-top: 32px; padding-top: 16px; border-top: 1px solid #e0e0e0; font-size: 13px; color: #80868b; }
      .app-footer span { color: #1a73e8; font-weight: 500; }

      /* =========================================
         MOBILE RESPONSIVE FIXES
         ========================================= */
      @media (max-width: 600px) {
        .summary-box {
          display: grid;
          grid-template-columns: 1fr 1fr;
          row-gap: 20px;
          padding: 20px 12px;
        }
        
        .banner-actions {
          width: 100%;
          justify-content: flex-start;
          margin-top: 8px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      
      <!-- Login Section -->
      <div id="pinSection">
        <h2>System Login</h2>
        <label class="input-label">Enter Secret PIN</label>
        <input type="password" id="pinInput" class="md-input" placeholder="Enter PIN">
        <button class="md-button" onclick="checkPin()">Enter System</button>
        <p id="pinMsg" style="color: #d93025; margin-top: 16px; font-size: 14px;"></p>
      </div>

      <!-- Main App Content -->
      <div id="mainAppSection" class="hidden">
        <h2>WBG NIMS Dashboard</h2>
        
        <div class="update-banner">
          <div class="banner-text">
            <span>&#9432;</span> Live Dashboard via Web API.
          </div>
          <div class="banner-actions">
            <button class="icon-btn" onclick="refreshDashboard()" title="Refresh Data">&#x21bb; Refresh</button>
            <button class="icon-btn logout-btn" onclick="logoutSystem()" title="Logout System">&#x2192; Logout</button>
          </div>
        </div>

        <div id="dashboardArea">
          <div class="loading">Loading dashboard metrics...</div>
        </div>

        <div class="section-divider"></div>

        <h2>Pending Submissions by Team</h2>
        <label class="input-label">Select Team</label>
        <select id="teamSelect" class="md-select">
          <option value="">-- Loading Teams... --</option>
        </select>
        <button class="md-button" onclick="fetchTeamSurveys()">View Pending Routes</button>
        <div id="teamSurveyArea" class="result-container"></div>

        <div class="section-divider"></div>

        <h2>Route Search</h2>
        <label class="input-label">Search Route Name</label>
        <input type="text" id="searchInput" class="md-input" placeholder="e.g. 0001 or BGO0006">
        <button class="md-button" onclick="performSearch()">Search</button>
        <div id="resultArea" class="result-container"></div>
      </div> 

      <div class="app-footer">
        Developed and Designed by <span>Ye Lin Aung</span><br>
        WBG NIMS &copy; 2026
      </div>

    </div> 

    <script>
      // ==========================================
      // CONFIGURED API URL 
      // ==========================================
      const API_URL = "https://script.google.com/macros/s/AKfycbyMVf9mkE92mpJDJfL9sC91wxUF6PSE_w2dbHORxmdA9kt98GyyHgm_LDhKsKTjtGQUyA/exec";
      
      let sessionPin = ""; // Stores valid PIN securely during active session

      // Enable Enter key for inputs
      document.getElementById("pinInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") { e.preventDefault(); checkPin(); }
      });
      document.getElementById("searchInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") { e.preventDefault(); performSearch(); }
      });

      async function fetchData(action, params = "") {
        const url = `${API_URL}?action=${action}&pin=${encodeURIComponent(sessionPin)}${params}`;
        try {
          const response = await fetch(url);
          return await response.json();
        } catch (error) {
          return { success: false, error: "Network error connecting to API. It might be blocked by CORS or the script URL is wrong." };
        }
      }

      async function checkPin() {
        const pin = document.getElementById("pinInput").value;
        const msg = document.getElementById("pinMsg");
        
        if (!pin) {
          msg.innerHTML = "Please enter a PIN.";
          return;
        }

        msg.innerHTML = "Authenticating...";
        
        try {
          const response = await fetch(`${API_URL}?action=verifyPin&pin=${encodeURIComponent(pin)}`);
          const data = await response.json();
          
          if (data.success && data.isValid) {
            sessionPin = pin; // Save PIN to send with future requests
            document.getElementById("pinSection").classList.add("hidden");
            document.getElementById("mainAppSection").classList.remove("hidden");
            loadDashboard();
          } else {
            msg.innerHTML = "Incorrect PIN!";
          }
        } catch (error) {
          msg.innerHTML = "Error verifying PIN. Please try again.";
        }
      }

      function logoutSystem() {
        sessionPin = ""; // Clear token
        document.getElementById("mainAppSection").classList.add("hidden");
        document.getElementById("pinSection").classList.remove("hidden");
        document.getElementById("pinInput").value = "";
        document.getElementById("pinMsg").innerHTML = "";
        document.getElementById("searchInput").value = "";
        document.getElementById("resultArea").innerHTML = "";
        document.getElementById("teamSurveyArea").innerHTML = "";
      }

      function refreshDashboard() {
        document.getElementById("dashboardArea").innerHTML = "<div class='loading'>Refreshing dashboard data...</div>";
        loadDashboard();
      }

      async function loadDashboard() {
        const dashArea = document.getElementById("dashboardArea");
        const teamDropdown = document.getElementById("teamSelect");
        
        const response = await fetchData("getDashboardData");

        if (!response.success) {
          dashArea.innerHTML = "<div class='alert-text'>" + response.error + "</div>";
          return;
        }

        const sum = response.summary;
        let html = "<div class='summary-box'>";
        html += `<div class='sum-item'><strong>Total Routes</strong><span>${sum.total}</span></div>`;
        html += `<div class='sum-item'><strong>Done</strong><span class='text-done'>${sum.done}</span></div>`;
        html += `<div class='sum-item'><strong>Need to Submit</strong><span class='text-survey'>${sum.survey}</span></div>`;
        html += `<div class='sum-item'><strong>Completed</strong><span class='text-blue'>${sum.percent}</span></div></div>`;

        // CHANGED: Added table-wrapper div for horizontal scrolling
        html += "<div class='table-wrapper'><table class='dash-table'>";
        html += "<tr><th class='col-team'>Team</th><th class='col-total'>Total</th><th class='col-done'>Done</th><th class='col-submit'>Need to Submit</th><th class='col-percent'>%</th></tr>";
        
        const teamNames = Object.keys(response.data).sort();
        teamDropdown.innerHTML = "<option value=''>-- Choose a Team --</option>";

        teamNames.forEach(team => {
          const tData = response.data[team];
          const numericPercent = parseFloat(tData.percent) || 0;
          
          html += `<tr>
            <td class='col-team'>${team}</td>
            <td class='col-total'>${tData.total}</td>
            <td class='col-done text-done'>${tData.done}</td>
            <td class='col-submit text-survey'>${tData.survey}</td>
            <td class='col-percent'>
              <div class='progress-container'>
                <div class='progress-text'>${tData.percent}</div>
                <div class='progress-bar-bg'><div class='progress-bar-fill' style='width: ${numericPercent}%;'></div></div>
              </div>
            </td>
          </tr>`;

          teamDropdown.innerHTML += `<option value='${team}'>${team}</option>`;
        });
        
        html += "</table></div>"; // CHANGED: Closed table-wrapper div
        dashArea.innerHTML = html;
      }

      async function fetchTeamSurveys() {
        const teamName = document.getElementById("teamSelect").value;
        const surveyArea = document.getElementById("teamSurveyArea");

        if (teamName === "") {
          surveyArea.innerHTML = "<div class='alert-text'>Please select a team from the dropdown.</div>";
          return;
        }

        surveyArea.innerHTML = "<div class='loading'>Fetching pending routes...</div>";

        const response = await fetchData("getPendingSurveyRoutes", `&teamName=${encodeURIComponent(teamName)}`);

        if (!response.success) {
          surveyArea.innerHTML = "<div class='alert-text'>" + response.error + "</div>";
          return;
        }

        if (response.routes.length === 0) {
          surveyArea.innerHTML = `<div class='success-notice'>All caught up! No pending routes for ${teamName}.</div>`;
        } else {
          let html = `<div class='match-card'>
            <div class='route-title'>Pending Routes (${response.routes.length})</div>
            <ul class='route-list'>`;
          
          response.routes.forEach(route => {
            html += `<li>${route.route}`;
            if (route.hasSurvey) html += "<span class='circle-tick' title='Survey Data is Yes'>&#10004;</span>";
            if (route.hasKmz) html += "<span class='pill-kmz' title='KMZ Data is Yes'>KMZ</span>";
            html += "</li>";
          });
          
          html += "</ul></div>";
          surveyArea.innerHTML = html;
        }
      }

      async function performSearch() {
        const searchTerm = document.getElementById("searchInput").value.trim();
        const resultArea = document.getElementById("resultArea");
        
        if(searchTerm === "") {
          resultArea.innerHTML = "<div class='alert-text'>Please enter a route name.</div>";
          return;
        }

        resultArea.innerHTML = "<div class='loading'>Searching sheet...</div>";
        
        const response = await fetchData("searchRoute", `&searchTerm=${encodeURIComponent(searchTerm)}`);

        if (!response.success) {
          resultArea.innerHTML = "<div class='alert-text'>" + response.error + "</div>";
          return;
        }

        if (response.found) {
          let html = "";
          response.results.forEach(res => {
            let teamLabel = (res.team && res.team !== "") ? `<strong>${res.team}</strong>` : `<em>Not Assigned</em>`;
            let statusBadge = res.status === "Done" ? "<div class='status-done'>Status: Done</div>" : "<div class='status-survey'>Status: Need to Submit</div>";

            html += `<div class='match-card'>
              <div class='route-title'>Route: ${res.route}</div>
              <div class='team-text'>Team: ${teamLabel}</div>
              <div class='team-text'>Survey Data: <strong>${res.surveyData}</strong></div>
              <div class='team-text'>KMZ Data: <strong>${res.kmzData}</strong></div>
              ${statusBadge}
            </div>`;
          });
          resultArea.innerHTML = html;
        } else {
          resultArea.innerHTML = "<div class='alert-text'>" + response.message + "</div>";
        }
      }
    </script>
  </body>
</html>
